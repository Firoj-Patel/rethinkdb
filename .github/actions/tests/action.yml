
name: Test base
description: Base action for running steps

inputs:
  command:
    description: The test runner command to execute.
    required: true
  download_artifacts:
    description: Download and decompress build artifacts.
    default: "true"
    required: false
  test_output_dir:
    description: Directory to store test output.
    default: /tmp/test-results
    required: false

# Composite step for using the test runner with multiple parameters.
runs:
  using: composite
  steps:
    - name: install prerequisites
      shell: bash
      run: |
        sudo apt update && \
        sudo apt install -y tar xz-utils curl make git ca-certificates gnupg2 libc6 libcurl4 libprotoc-dev libprotobuf-c-dev libprotobuf-dev protobuf-c-compiler protobuf-compiler

    - name: download build artifacts
      uses: actions/download-artifact@v4
      if: ${{ inputs.download_artifacts == 'true' }}
      with:
        # Must match the name used in the 'build' job
        name: build-artifacts

    - name: decompress build dir
      if: ${{ inputs.download_artifacts == 'true' }}
      shell: bash
      run: tar -xzf build.tar.gz

    # Ensure the test output dir does not pre-exist: some runners abort if the dir exists.
    - name: ensure clean test output dir
      shell: bash
      run: |
        if [ -d "${{ inputs.test_output_dir }}" ]; then
          rm -rf "${{ inputs.test_output_dir }}"
        fi

    - name: run tests
      shell: bash
      run: ${{ inputs.command }}
      env:
        TEST_OUTPUT_DIR: ${{ inputs.test_output_dir }}

    - name: Generate artifact name
      id: generate-name
      shell: bash
      run: echo "artifact=rethinkdb-artifact-${{ github.run_id }}-$(date +%s)" >> $GITHUB_OUTPUT

    # Compress test artifacts; if the dir doesn't exist (early abort), create an empty artifact so uploads are consistent.
    - name: compress test artifacts for upload
      if: always()
      shell: bash
      run: |
        ART="${{ steps.generate-name.outputs.artifact }}.tar.gz"
        OUTDIR="${{ inputs.test_output_dir }}"
        if [ -d "${OUTDIR}" ]; then
          # Tar the contents, not the absolute path, to avoid leading slashes.
          tar -czf "${ART}" -C "${OUTDIR}" .
        else
          echo "No test output directory found at '${OUTDIR}'. Creating empty artifact."
          mkdir -p _empty_artifact_dir
          tar -czf "${ART}" -C _empty_artifact_dir .
        fi

    - name: upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.generate-name.outputs.artifact }}
        path: ${{ steps.generate-name.outputs.artifact }}.tar.gz
